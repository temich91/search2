[package]
name = "fsearch"
version = "0.1.0"
edition = "2021"
description = "Fast text search across file contents"
authors = ["fsearch"]

[[bin]]
name = "fsearch"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
walkdir = "2.5"
encoding_rs = "0.8"
memmap2 = "0.9"
anyhow = "1.0"
indicatif = "0.17"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
